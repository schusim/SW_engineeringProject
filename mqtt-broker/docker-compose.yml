services:
  mosquitto:
    image: eclipse-mosquitto:2.1.4-alpine
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    networks:
      - iot-net
    restart: unless-stopped

# External network for IoT devices added by flo for ingestion service integration
networks:
  iot-net:
    name: iot-net
    external: true